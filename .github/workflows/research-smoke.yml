name: research-smoke

"on":
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run tiny research smoke test
        run: microalpha-smoke --manifest-out /tmp/microalpha-phase0-smoke.yaml
