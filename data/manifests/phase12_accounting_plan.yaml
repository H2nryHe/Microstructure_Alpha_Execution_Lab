ci_gate:
  phase11_commit_sha: 0a4ef8c2c6d5b98a3709aa0f95400f21a4e8c44e
  tests_run_id: 31395063031
  research_smoke_run_id: 31395063336
  python_311_github_actions_required: true

development_policy:
  allowed_dates:
    - "2024-07-01"
  forbidden_dates:
    - "2026"
  instrument: BTC-USDT
  vendor_symbol: BTCUSDT
  models:
    - qi_direct_baseline
    - lightgbm_qi_ofi
    - lightgbm_extended
  execution_modes:
    - market
    - passive
  latency_scenarios_ms:
    - 0
    - 100
  source_artifact_root: /tmp/microalpha-phase11
  accounting_artifact_root: /tmp/microalpha-phase12

accounting_conventions:
  independent_scenario_keys:
    - date
    - model
    - execution_mode
    - latency_ms
  initial_cash: 0.0
  initial_position: 0.0
  base_quantity_unit: BTC
  quote_currency: USDT
  signed_quantity:
    buy: positive
    sell: negative
  position_update: position_previous_plus_signed_quantity
  gross_cash: excludes recorded fill fees
  net_cash: includes recorded fill fees
  buy_cash_change:
    gross: minus_fill_price_times_quantity
    net: minus_fill_price_times_quantity_minus_fee_quote
  sell_cash_change:
    gross: plus_fill_price_times_quantity
    net: plus_fill_price_times_quantity_minus_fee_quote
  negative_cash_allowed: true
  hidden_capital_injection_allowed: false

realized_pnl:
  method: average_cost_inventory
  long_close_formula: exit_price_minus_average_entry_price_times_closed_quantity
  short_close_formula: average_entry_price_minus_exit_price_times_closed_quantity
  reversal_policy: close_existing_inventory_first_then_open_residual_opposite_inventory
  fee_treatment: fees_tracked_separately_from_gross_realized_pnl

marking:
  mark_price: mid
  mark_source: /tmp/microalpha-multiday/derived/date={date}/research_100ms.parquet
  mark_time_rule: most_recent_causally_observable_valid_mid_at_or_before_valuation_timestamp
  unavailable_mark_policy: valuation_unavailable_do_not_invent_price
  valuation_grid: existing_100ms_research_grid
  terminal_inventory_policy: report_remaining_inventory_without_forced_liquidation
  forced_end_of_day_liquidation: forbidden

ledger_schema:
  required_columns:
    - timestamp
    - cash
    - gross_cash
    - net_cash
    - position
    - average_entry_price
    - mark_mid
    - inventory_market_value
    - gross_equity
    - net_equity
    - gross_pnl
    - net_pnl
    - realized_pnl
    - unrealized_pnl
    - fees_paid
    - turnover

turnover:
  fill_notional: abs_fill_price_times_signed_quantity
  total_turnover: sum_fill_notional
  buy_notional: sum_buy_fill_notional
  sell_notional: sum_sell_fill_notional
  gross_traded_quantity: sum_abs_signed_quantity
  parent_order_count_source: frozen_phase11_orders
  fill_count_source: frozen_phase11_child_fills

pnl_normalization:
  gross_pnl_bps_of_turnover: gross_pnl_div_total_turnover_times_10000
  net_pnl_bps_of_turnover: net_pnl_div_total_turnover_times_10000
  pnl_per_parent_order: pnl_div_parent_order_count
  pnl_per_fill: pnl_div_fill_count
  annualization: forbidden
  sharpe_ratio: forbidden

reconciliation:
  parent_child_quantity: sum_child_fill_quantities_equals_parent_filled_quantity
  fill_conservation: final_position_equals_sum_signed_fill_quantities
  cash_conservation: final_cash_equals_sum_fill_cash_changes
  equity_identity: cash_plus_position_times_mark_mid_equals_equity
  fee_identity: gross_pnl_minus_net_pnl_equals_cumulative_fees_paid
  duplicate_fill_policy: reject_duplicate_fill_ids
  scenario_isolation: reset_cash_position_cost_basis_and_fees_per_scenario
  deterministic_ordering: fill_time_then_order_id_then_child_fill_index

position_target_mismatch:
  desired_state_source: /tmp/microalpha-phase10/signals/date={date}/model={model}/signals.parquet
  desired_units: final_signal
  actual_units: position_divided_by_target_order_quantity_at_first_transition_not_used_for_orders
  metrics:
    - desired_active_actual_zero_fraction
    - direction_mismatch_fraction
    - partially_attained_fraction
  corrective_orders: forbidden

output_policy:
  local_ledger_root: /tmp/microalpha-phase12
  tracked_report_dir: reports/phase12
  large_time_series_committed: false
  deterministic_hash_excludes:
    - runtime
    - creation_timestamp
    - absolute_local_paths

required_reports:
  - accounting_summary.csv
  - pnl_by_scenario.csv
  - inventory_summary.csv
  - turnover_summary.csv
  - realized_unrealized_summary.csv
  - execution_pnl_decomposition.csv
  - accounting_manifest.json
  - phase12_summary.json
  - README.md

required_figures:
  - market_0ms_gross_equity_by_model.png
  - market_latency_pnl_path.png
  - passive_pnl_path.png
  - position_path.png
  - absolute_inventory_exposure.png
  - gross_vs_net_pnl.png
  - realized_vs_unrealized_terminal_pnl.png
  - turnover_by_scenario.png
  - passive_desired_vs_actual_mismatch.png
  - market_vs_passive_accounting_comparison.png

acceptance_criteria:
  - exact Phase 11 commit green under Python 3.11 CI
  - Phase 12 accounting plan frozen before real PnL analysis
  - 2026 holdout not accessed
  - exact frozen Phase 11 fills consumed
  - scenario ledgers isolated
  - signed quantity convention explicit
  - cash conservation passes
  - inventory conservation passes
  - parent-child fill reconciliation passes
  - duplicate fills rejected
  - realized PnL long_short_reversal_cases pass
  - unrealized PnL open_inventory_cases pass
  - cash_plus_marked_inventory_equals_equity
  - gross_net_difference_reconciles_to_recorded_fees
  - terminal inventory reported without synthetic liquidation
  - passive low_fill_effects_visible
  - no realistic cost grid introduced
  - no Sharpe_or_annualization_reported
  - deterministic accounting artifact hash exists
  - deterministic Phase 12 results hash exists
  - compact reports and required figures exist
