  - 0.25 and 0.50 bps cost survival reported
  - breakeven costs by date reported
  - model ranking stability reported
  - incremental economics reported
  - order-size sensitivity complete
  - passive robustness spans three dates
  - queue sensitivity reported
  - TTL sensitivity reported
  - residual inventory visible
