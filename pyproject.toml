[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microstructure-alpha-execution-lab"
version = "0.1.0"
description = "Market microstructure alpha research and execution simulation lab."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "pyarrow>=14.0",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
    "lightgbm>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]

[project.scripts]
microalpha-smoke = "microalpha.cli:main"
microalpha-ingest = "microalpha.data.ingest_cli:main"
microalpha-qa = "microalpha.data.qa_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
